# =============================================================================
#  Main Nginx config
#
#  - Runs as non-root (UID 1000). The `user` directive is therefore OMITTED:
#    Nginx errors out with "the 'user' directive makes sense only if the
#    master process runs with super-user privileges".
#  - pid and every temp path live in /tmp because /var/run is not writable
#    by a non-root user.
#  - Per-app vhosts live in conf.d/
# =============================================================================

pid       /tmp/nginx.pid;
worker_processes  auto;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log    /dev/stdout;

    # ---- non-root writable temp paths ----
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 1024M;
    client_body_timeout  600s;
    proxy_send_timeout   600s;
    proxy_read_timeout   600s;
    send_timeout         600s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    add_header X-Content-Type-Options    nosniff                          always;
    add_header X-Frame-Options           SAMEORIGIN                       always;
    add_header Referrer-Policy           strict-origin-when-cross-origin   always;
    add_header Strict-Transport-Security "max-age=31536000"                always;

    # ---- brute-force protection -------------------------------------------
    # Two zones: a generous one for normal browsing, and a strict one for the
    # password-protected app routes. An attacker guessing passwords gets far
    # fewer attempts per second than a real user loading pages.
    limit_req_zone $binary_remote_addr zone=perip:10m      rate=10r/s;
    limit_req_zone $binary_remote_addr zone=authgate:10m   rate=3r/s;
    limit_conn_zone $binary_remote_addr zone=connlimit:10m;

    # -----------------------------------------------------------------------
    # OPTIONAL HARD LOCKDOWN - uncomment to restrict access to your IPs only.
    #
    # This is the strongest guarantee that nobody but you can use the Space,
    # but it is a double-edged sword: a mobile phone gets a new IP whenever it
    # reconnects, so you would be locked out too. Find your IP with
    #     curl https://ifconfig.me
    # and remember Hugging Face's own build pods do NOT need this - it only
    # filters inbound browser traffic.
    #
    # In the server block below, add at the top:
    #     allow 203.0.113.7;      # your home IP
    #     allow 198.51.100.0/24;  # your office range (optional)
    #     deny  all;
    # -----------------------------------------------------------------------

    # -----------------------------------------------------------------------
    # ONE server block holds every route.
    #
    # nginx picks exactly ONE server block per request: exact server_name
    # match, then best wildcard, then the `default_server`. `server_name _;`
    # is a literal name no Host header ever matches, so if conf.d/*.conf
    # declared their own `server {}`, every one of them would be UNREACHABLE
    # - all traffic would land on the default_server below, which has no
    # /pb/ /files/ /rss/ location, and nginx would return 404 for all of
    # them. (Verified: a curl to /pb/ returned 404 with that layout.)
    #
    # So conf.d/*.conf contain ONLY `location` blocks, and this include MUST
    # stay inside this server{}.
    # -----------------------------------------------------------------------
    server {
        listen      7860 default_server;
        server_name _;

        # ---- KEEP-ALIVE: must stay open, the cron pinger needs it ----
        location = /health {
            auth_basic off;
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"private-cloud-stack"}';
        }

        # ---- root: a tiny index, no app mounted here ----
        # MUST be served from disk, not `return 200 '...'`. nginx handles
        # `return` in the rewrite phase, which runs BEFORE the access phase
        # where auth_basic is evaluated - so a `return` in this location would
        # hand the page to anyone with no password prompt (verified: 200 for
        # `return`, 401 for `try_files` and `proxy_pass`, same auth block).
        # A real file lands in the content phase, after access, so the gate
        # applies. index.html is copied to /etc/nginx/ by the Dockerfile.
        location = / {
            auth_basic           "Private Stack";
            auth_basic_user_file /home/user/.htpasswd;
            limit_req zone=perip burst=20 nodelay;
            root /etc/nginx;
            try_files /index.html =404;
        }

        # ---- catch-all: nothing is served for paths nobody declared ----
        # Longest prefix wins, so /pb/ /files/ /rss/ /vw/ /s/ still reach
        # their own blocks; anything else lands here.
        #
        # It returns 404 rather than 401 on purpose. `return` runs in the
        # rewrite phase, before auth_basic's access phase, so the auth_basic
        # below does NOT actually challenge - and a bare 404 is the better
        # answer anyway: it confirms nothing about what is running here and
        # offers no password prompt to grind against. The auth_basic line
        # stays as a guard rail - if someone later swaps `return` for a
        # proxy_pass or a static file, the gate takes effect immediately.
        location / {
            auth_basic           "Private Stack";
            auth_basic_user_file /home/user/.htpasswd;
            limit_req  zone=authgate burst=10 nodelay;
            limit_conn connlimit 20;
            return 404;
        }

        # ---- per-app routes: /pb/ /files/ /rss/ /vw/ /s/ ----
        include /etc/nginx/conf.d/*.conf;
    }
}