# =============================================================================
#  Vaultwarden  (Rust)
#  public path : /vw/
#  upstream    : 127.0.0.1:8222
#
#  Ye conf baaki teeno se ALAG hai - do wajah hain:
#
#  1) TRAILING-SLASH REDIRECT  (upstream issue #6287)
#     Vaultwarden ka web-vault RELATIVE asset URLs serve karta hai.
#     /vw (bina slash) pe browser unhe / ke against resolve karta hai ->
#     har asset 404, page toota. Maintainers ne ise "not planned" me close
#     kiya hai ("we can't fix this on the server side"), so nginx khud
#     theek karta hai: /vw  ->  308  ->  /vw/
#
#  2) auth_basic OFF karna padta hai (agar extension/mobile chahiye)
#     Bitwarden clients (browser extension, mobile app, CLI) HTTP Basic auth
#     BOLTE HI NAHI - har API call pe 401 milega aur wo kabhi connect
#     nahi honge. Vaultwarden ke paas apna hi gate hai: Argon2 master
#     password + end-to-end encryption (data server pe ciphertext hi rehta hai).
#
#     >>> AGAR TU SIRF BROWSER KE WEB VAULT USE KARNE WALE HO, to neeche
#     >>> `auth_basic` ko ON kar de - phir double gate lagega (stack password
#     >>> + master password), par extension/mobile kaam band ho jayenge.
# =============================================================================

# issue #6287: /vw without a trailing slash breaks every relative asset URL
location = /vw {
    return 308 /vw/;
}

location /vw/ {
    limit_req  zone=perip burst=20 nodelay;
    limit_conn connlimit 20;
    client_max_body_size 128M;

    # ---- password gate: OFF (upar wale comment ko padh) ----
    # Yahan ON karna ho to ye do line badal de:
    #   auth_basic           "Private Stack";
    #   auth_basic_user_file /home/user/.htpasswd;
    auth_basic off;

    proxy_pass http://127.0.0.1:8222/;

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;

    proxy_read_timeout  300s;
}
