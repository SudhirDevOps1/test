# =============================================================================
#  Chhoto URL  (Rust)
#  public path : /s/
#  upstream    : 127.0.0.1:4567
#
#  The trailing slash on proxy_pass is REQUIRED: it makes nginx strip the
#  location prefix before forwarding. So a request to /s/gifted-ramanujan
#  reaches the backend as /gifted-ramanujan (which is what it redirects on),
#  and /s/admin/manage arrives as /admin/manage.
#
#  CHHOTO_SITE_URL is set to <scheme>://<host>/s by supervisord, so every
#  short link it hands out is already the public /s/... form.
#
#  Rate limit uses zone=perip (10 r/s), NOT authgate: short links are meant to
#  be clicked, and a 3 r/s password-gate budget would throttle normal use.
# =============================================================================

location /s/ {
    limit_req  zone=perip burst=20 nodelay;
    limit_conn connlimit 20;
    client_max_body_size 8m;

    # ---- password gate ----
    auth_basic           "Private Stack";
    auth_basic_user_file /home/user/.htpasswd;

    proxy_pass http://127.0.0.1:4567/;

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;

    proxy_read_timeout  60s;
}
