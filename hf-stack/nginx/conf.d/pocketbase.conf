# =============================================================================
#  PocketBase  (Go)
#  public path : /pb/
#  upstream    : 127.0.0.1:8090
#
#  The trailing slash on proxy_pass is REQUIRED: it makes nginx strip the
#  location prefix before forwarding. Without any path component nginx
#  passes the ORIGINAL uri (/pb/...) to the backend, which 404s.
# =============================================================================

location /pb/ {
    limit_req  zone=authgate burst=10 nodelay;
    limit_conn connlimit 20;
    client_max_body_size 1024M;

    # ---- password gate ----
    auth_basic           "Private Stack";
    auth_basic_user_file /home/user/.htpasswd;

    proxy_pass http://127.0.0.1:8090/;

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;

    # ---- websocket (live sync, git, websockets) ----
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_read_timeout  600s;
    proxy_buffering   off;
}
