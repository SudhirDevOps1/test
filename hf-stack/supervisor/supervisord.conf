; =============================================================================
;  Supervisord - one container, many processes.
;  A Docker container can only have ONE foreground command, so this is what
;  actually keeps everything alive.
;
;  All logs go to stdout/stderr (NOT files) so `docker logs` / the HF Logs tab
;  shows everything, and nothing can crash on an unwritable log path.
; =============================================================================

[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/tmp/supervisord.log
logfile_maxbytes=50MB
logfile_backups=2
loglevel=info
; NOTE: no `user=` directive - we are already running as UID 1000, and
; supervisord warns (and ignores it) when asked to change user.

; ---------------------------------------------------------------- nginx ----
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ------------------------------------------------------------ PocketBase ---
[program:pocketbase]
command=/opt/pocketbase/pocketbase serve --http=127.0.0.1:8090 --dir=/app/data/pocketbase
directory=/app/data/pocketbase
autostart=true
autorestart=true
startsecs=5
startretries=5
priority=20
; POCKETBASE_BASE_URL makes every generated URL include the /pb/ prefix,
; without it the admin UI loads and then 404s on its own assets.
;
; %(ENV_SPACE_HOST)s is supervisord's NATIVE way to read an environment
; variable at startup - no sed, no generated file, and the value never has
; to be written into any file inside the repo. The entrypoint exports
; SPACE_HOST (with a fallback) so this expansion can never fail.
;
; %(ENV_URL_SCHEME)s is the same trick for http vs https. It MUST be exported
; by the entrypoint too - supervisord REFUSES to start if an expansion is
; undefined. Default is https (Cloudflare/HF terminate TLS in front of us);
; the local docker-compose.yml sets it to http because there is no TLS on
; localhost:7860. Hardcoding https made every generated link point at
; https://localhost:... which cannot load.
environment=POCKETBASE_BASE_URL="%(ENV_URL_SCHEME)s://%(ENV_SPACE_HOST)s/pb/",POCKETBASE_DATA_DIR="/app/data/pocketbase"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --------------------------------------------------------------- OpenList ---
[program:openlist]
command=/opt/openlist/openlist server --data /app/data/openlist --bind 127.0.0.1:5244
directory=/app/data/openlist
autostart=true
autorestart=true
startsecs=5
startretries=5
priority=20
; SITE_URL is OpenList's real base-path setting (internal/conf/config.go:
;     SiteURL string `json:"site_url" env:"SITE_URL"`)
; Without it OpenList assumes it lives at "/" and every generated link points
; at /assets/... instead of /files/assets/... -> blank page + 404s.
environment=SITE_URL="%(ENV_URL_SCHEME)s://%(ENV_SPACE_HOST)s/files/"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; -------------------------------------------------------------- Miniflux ---
[program:miniflux]
command=/opt/miniflux/miniflux
directory=/app/data/miniflux
autostart=true
autorestart=true
startsecs=5
startretries=5
priority=20
; BASE_URL tells Miniflux it lives under /rss/ - without it every link and
; asset 404s. Run `miniflux -migrate` once if the DB is new.
environment=MINIFLUX_BASE_URL="%(ENV_URL_SCHEME)s://%(ENV_SPACE_HOST)s/rss/",MINIFLUX_LISTEN_ADDR="127.0.0.1:8080"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ------------------------------------------------------------- Vaultwarden ---
[program:vaultwarden]
command=/opt/vaultwarden/vaultwarden
directory=/app/data/vaultwarden
autostart=true
autorestart=true
startsecs=8
startretries=5
priority=20
; Vaultwarden reads its ENTIRE config from the environment - no file to render,
; so this section stays short.
;
;   ROCKET_ADDRESS/PORT   loopback only; nginx on 7860 is the sole door in
;   DATA_FOLDER           db.sqlite3 + attachments + sends sit here
;   WEB_VAULT_FOLDER      where the static frontend was COPY'd at build time
;   DOMAIN                MUST end in /vw/ or every generated link 404s
;   SIGNUPS_ALLOWED       comes from .env (VW_SIGNUPS); set it to "false"
;                         the moment your account exists, otherwise anyone
;                         who reaches the URL can register on your vault
;
; %(ENV_URL_SCHEME)s and %(ENV_SPACE_HOST)s are exported by entrypoint.sh.
; supervisord REFUSES to start if any expansion is undefined, so that export
; is not optional.
environment=ROCKET_ADDRESS="127.0.0.1",ROCKET_PORT="8222",DATA_FOLDER="/app/data/vaultwarden",WEB_VAULT_FOLDER="/web-vault",DOMAIN="%(ENV_URL_SCHEME)s://%(ENV_SPACE_HOST)s/vw/",SIGNUPS_ALLOWED="%(ENV_VW_SIGNUPS)s",ADMIN_TOKEN="",DISABLE_ADMIN_TOKEN="true"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ------------------------------------------------------------- Chhoto URL ---
[program:chhoto]
command=/app/chhoto-url
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=5
priority=20
; CHHOTO_SITE_URL must be the /s prefix with NO trailing slash - the app
; appends /<slug> itself, and a trailing one would emit /s//slug.
; WAL mode is on because litestream replicates this database (litestream
; requires WAL), and the docs say mount a DIRECTORY, not a bare file.
;
; CHHOTO_PASSWORD is exported by entrypoint.sh - generated when absent - so
; this %(ENV_...) expansion can never be undefined. It must stay alphanumeric:
; supervisord parses environment= as comma-separated KEY="value" pairs, so a
; comma or quote in the password would corrupt the whole line.
environment=CHHOTO_LISTEN_ADDRESS="127.0.0.1",CHHOTO_LISTEN_PORT="4567",CHHOTO_DB_URL="/app/data/chhoto/urls.sqlite",CHHOTO_SQLITE_USE_WAL_MODE="True",CHHOTO_SITE_URL="%(ENV_URL_SCHEME)s://%(ENV_SPACE_HOST)s/s",CHHOTO_PASSWORD="%(ENV_CHHOTO_PASSWORD)s",CHHOTO_SLUG_STYLE="Pair",CHHOTO_REDIRECT_METHOD="TEMPORARY"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ------------------------------------------------------------- Litestream ---
; Runs from the shell wrapper so it idles instead of crash-looping when B2
; credentials have not been configured yet.
[program:litestream]
command=/bin/bash -c 'if [ "${LITESTREAM_DISABLED:-0}" = "1" ]; then echo "litestream disabled (no B2 credentials)"; exec sleep infinity; else exec litestream replicate -config /etc/litestream/litestream.yml; fi'
autostart=true
autorestart=true
startsecs=5
startretries=5
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------------------------------------------------------------- restic ---
[program:restic]
command=/bin/bash -c 'if [ "${BACKUP_DISABLED:-0}" = "1" ]; then echo "restic disabled (no B2 credentials)"; exec sleep infinity; else /app/restic/backup.sh; while true; do sleep 21600; /app/restic/backup.sh; done; fi'
autostart=true
autorestart=true
startsecs=20
startretries=3
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0